[project]
name = "easybrowser"
version = "0.1.0"
description = "浏览器自动化本地 HTTP API —— Playwright 托管，52 个浏览器操作工具，录制方式 + 廉价模型实现浏览器自动化"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "playwright>=1.44",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
easybrowser = "easybrowser.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["easybrowser", "easybrowser.tools", "easybrowser.adapters"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
